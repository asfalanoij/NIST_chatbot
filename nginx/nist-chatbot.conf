server {
    listen 80;
    server_name 80053.rudyprasetiya.com 80053-api.rudyprasetiya.com;
    return 301 https://$host$request_uri;
}

# Frontend — static SPA
server {
    listen 443 ssl;
    server_name 80053.rudyprasetiya.com;

    ssl_certificate     /etc/letsencrypt/live/80053.rudyprasetiya.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/80053.rudyprasetiya.com/privkey.pem;

    root /var/www/nist-frontend;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Backend API — reverse proxy to gunicorn
server {
    listen 443 ssl;
    server_name 80053-api.rudyprasetiya.com;

    ssl_certificate     /etc/letsencrypt/live/80053-api.rudyprasetiya.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/80053-api.rudyprasetiya.com/privkey.pem;

    location / {
        proxy_pass         http://127.0.0.1:5050;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_buffering    off;
    }
}
