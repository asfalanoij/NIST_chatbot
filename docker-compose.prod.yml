version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nistbot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: nistbot
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nistbot"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:5050:5050"
    environment:
      DATABASE_URL: postgresql://nistbot:${POSTGRES_PASSWORD}@db:5432/nistbot
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: gemini-2.0-flash
      GEMINI_EMBEDDING_MODEL: models/text-embedding-004
      API_KEY: ${API_KEY}
      SECRET_KEY: ${SECRET_KEY}
      CORS_ORIGINS: https://80053.rudyprasetiya.com
      DISABLE_INGEST: "true"
      PORT: "5050"
      FLASK_DEBUG: "false"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
